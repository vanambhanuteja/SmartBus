name: Deploy to Azure (manual)

# Cloud deployment is a SEPARATE, manually-triggered stage. It needs Azure credentials and costs money,
# so it never runs automatically. Protect it with a GitHub Environment named "azure" (required reviewers).
on:
  workflow_dispatch:
    inputs:
      image_tag: { description: 'Image tag already pushed to ACR', required: true }

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: azure
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_acr_name: ${{ secrets.ACR_NAME }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
    defaults: { run: { working-directory: infrastructure/terraform } }
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan
